<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta http-equiv="Content-Security-Policy" content="default-src 'self' 'unsafe-inline' 'unsafe-eval'; media-src 'self' blob:; connect-src 'self' ws://*:* http://*:* https://*:* ws://*:* wss://*:*">
  <title>Musicali Bar</title>
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    body { background:#0a0a0a; color:#fff; font-family:'Courier New',monospace; height:100vh; display:flex; flex-direction:column; overflow:hidden; }

    /* ── LOGIN ── */
    #login-screen {
      flex:1; display:flex; flex-direction:column; align-items:center; justify-content:center; gap:0;
    }
    #login-screen.hidden { display:none; }
    .login-box {
      background:#111; border:1px solid #222; border-radius:4px; padding:40px 36px; width:360px; display:flex; flex-direction:column; gap:16px;
    }
    .login-box h2 { font-size:13px; letter-spacing:3px; text-transform:uppercase; color:#555; text-align:center; margin-bottom:8px; }
    .login-box .brand { font-size:22px; font-weight:bold; color:#fff; text-align:center; letter-spacing:1px; margin-bottom:4px; }
    .login-field { display:flex; flex-direction:column; gap:4px; }
    .login-field label { font-size:9px; letter-spacing:2px; text-transform:uppercase; color:#444; }
    .login-field input {
      background:#0d0d0d; border:1px solid #222; color:#ccc; padding:8px 10px;
      font-size:12px; font-family:'Courier New',monospace; border-radius:2px; outline:none;
    }
    .login-field input:focus { border-color:#444; }
    #btn-login {
      width:100%; padding:10px; background:#1a1a1a; border:1px solid #333; color:#ccc;
      font-family:'Courier New',monospace; font-size:11px; letter-spacing:2px; text-transform:uppercase;
      cursor:pointer; border-radius:2px; margin-top:4px; transition:all .2s;
    }
    #btn-login:hover:not(:disabled) { background:#222; border-color:#555; color:#fff; }
    #btn-login:disabled { opacity:.4; cursor:not-allowed; }
    #login-error { font-size:10px; color:#ff4444; text-align:center; min-height:14px; letter-spacing:1px; }
    #login-status { font-size:10px; color:#ffaa00; text-align:center; min-height:14px; letter-spacing:1px; }

    /* ── APP PRINCIPAL ── */
    #app-screen { flex:1; display:flex; flex-direction:column; overflow:hidden; }
    #app-screen.hidden { display:none; }

    #titlebar { height:32px; background:#111; display:flex; align-items:center; padding:0 16px; -webkit-app-region:drag; border-bottom:1px solid #222; flex-shrink:0; transition: border-color 0.5s, background 0.5s; }
	    #titlebar.source-queue { border-bottom-color: #27ae60; background: #112211; }
	    #titlebar.source-graph { border-bottom-color: #3498db; background: #111a22; }
	    #titlebar.source-transition { border-bottom-color: #e67e22; background: #221a11; }
    #titlebar span { font-size:11px; color:#555; letter-spacing:2px; text-transform:uppercase; }
    #titlebar-right { margin-left:auto; display:flex; align-items:center; gap:12px; -webkit-app-region:no-drag; }
    #logged-as { font-size:9px; color:#333; letter-spacing:1px; }
    #btn-logout {
      font-size:9px; color:#333; letter-spacing:1px; text-transform:uppercase;
      background:none; border:none; cursor:pointer; font-family:'Courier New',monospace; padding:0;
    }
    #btn-logout:hover { color:#ff4444; }
    #btn-toggle-sidebar { font-size:14px; color:#555; background:none; border:none; cursor:pointer; font-family:"Courier New",monospace; padding:0 8px; }
    #btn-toggle-sidebar:hover { color:#fff; }
    #status-dot { width:6px; height:6px; border-radius:50%; background:#333; margin-right:8px; transition:background .3s; }
    #status-dot.connected { background:#00ff88; }
    #status-dot.connecting { background:#ffaa00; animation:pulse 1s infinite; }
    #status-dot.error { background:#ff4444; }
    @keyframes pulse { 0%,100%{opacity:1} 50%{opacity:.3} }

    #main { flex:1; display:grid; grid-template-columns:1fr 320px; overflow:hidden; }
    #player-section { display:flex; flex-direction:column; align-items:center; justify-content:center; padding:32px; position:relative; overflow:hidden; }
	    #bg-video {
	      position:absolute; top:50%; left:50%; transform:translate(-50%,-50%);
	      min-width:100%; min-height:100%; width:auto; height:auto;
	      object-fit:cover; opacity:0; pointer-events:none; z-index:0;
	      display:none;
	    }
	    #bg-video.activo { display:block; opacity:1; }
    #now-playing { text-align:center; margin-bottom:24px; }
    #song-title { font-size:28px; font-weight:bold; letter-spacing:-.5px; color:#fff; margin-bottom:4px; }
    #song-artist { font-size:14px; color:#555; letter-spacing:1px; text-transform:uppercase; }
    #download-status { margin-top:16px; padding:8px 16px; border-radius:4px; font-size:12px; letter-spacing:1px; text-transform:uppercase; background:#111; border:1px solid #222; color:#555; min-width:200px; text-align:center; }
    #download-status.downloading { border-color:#ffaa00; color:#ffaa00; }
    #download-status.ready { border-color:#00ff88; color:#00ff88; }
    #download-status.cached { border-color:#0088ff; color:#0088ff; }
    #download-status.error { border-color:#ff4444; color:#ff4444; }

    #sidebar { background:#0d0d0d; border-left:1px solid #1a1a1a; display:flex; flex-direction:column; overflow:hidden; }
    #config-section { padding:20px; border-bottom:1px solid #1a1a1a; }
    #config-section h3 { font-size:10px; color:#333; letter-spacing:2px; text-transform:uppercase; margin-bottom:12px; }
    #btn-reconnect { width:100%; padding:8px; background:#1a1a1a; border:1px solid #333; color:#ccc; font-family:'Courier New',monospace; font-size:11px; letter-spacing:2px; text-transform:uppercase; cursor:pointer; border-radius:2px; transition:all .2s; }
    #btn-reconnect:hover { background:#222; border-color:#555; color:#fff; }

    #api-url-display { font-size:10px; color:#333; margin-bottom:8px; word-break:break-all; }

    #log-section { flex:1; overflow:hidden; display:flex; flex-direction:column; padding:20px; }
    #log-section h3 { font-size:10px; color:#333; letter-spacing:2px; text-transform:uppercase; margin-bottom:12px; flex-shrink:0; }
    #log { flex:1; overflow-y:auto; font-size:10px; color:#444; line-height:1.6; }
    #log .entry { padding:2px 0; border-bottom:1px solid #111; }
    #log .entry.info { color:#555; }
    #log .entry.success { color:#00ff88; }
    #log .entry.warn { color:#ffaa00; }
    #log .entry.error { color:#ff4444; }
    #log::-webkit-scrollbar { width:3px; }
    #log::-webkit-scrollbar-track { background:transparent; }
    #log::-webkit-scrollbar-thumb { background:#222; }

    #queue-section { border-top:1px solid #1a1a1a; padding:12px 20px; max-height:200px; display:flex; flex-direction:column; overflow:hidden; }
    #queue-section h3 { font-size:10px; color:#333; letter-spacing:2px; text-transform:uppercase; margin-bottom:8px; flex-shrink:0; }
    #queue-list { flex:1; overflow-y:auto; font-size:11px; }
    #queue-list .q-item { display:flex; align-items:center; gap:8px; padding:4px 0; border-bottom:1px solid #111; color:#555; }
    #queue-list .q-item .q-pos { font-size:9px; color:#333; min-width:16px; text-align:right; }
    #queue-list .q-item .q-title { color:#888; overflow:hidden; text-overflow:ellipsis; white-space:nowrap; }
    #queue-list .q-item .q-badge { font-size:8px; padding:1px 4px; border-radius:2px; background:#1a1a1a; color:#555; margin-left:auto; text-transform:uppercase; }
    #queue-list::-webkit-scrollbar { width:3px; }
    #queue-list::-webkit-scrollbar-track { background:transparent; }
    #queue-list::-webkit-scrollbar-thumb { background:#222; }
    #videos-count { padding:12px 20px; border-top:1px solid #1a1a1a; font-size:10px; color:#333; letter-spacing:1px; }

    #fondo-section { padding:12px 20px; border-bottom:1px solid #1a1a1a; display:flex; flex-direction:column; gap:6px; }
    #fondo-section h3 { font-size:10px; color:#333; letter-spacing:2px; text-transform:uppercase; }
    
    
    #btn-importar-fondo, #btn-pantalla-completa { padding:6px; background:#1a1a1a; border:1px solid #333; color:#ccc; font-family:'Courier New',monospace; font-size:10px; letter-spacing:1px; text-transform:uppercase; cursor:pointer; border-radius:2px; }
    #btn-importar-fondo:hover, #btn-pantalla-completa:hover { background:#222; border-color:#555; color:#fff; }
    #fondo-status { font-size:10px; color:#666; min-height:14px; }
  </style>
</head>
<body>

<!-- ══════════════ PANTALLA DE LOGIN ══════════════ -->
<div id="login-screen">
  <div class="login-box">
    <div class="brand">🎵 Musicali Bar</div>
    <h2>Iniciar sesión</h2>
    <div class="login-field">
      <label>API URL</label>
      <input id="login-api" type="text" value="" placeholder="http://backend:5251">
    </div>
    <div class="login-field">
      <label>Usuario</label>
      <input id="login-username" type="text" placeholder="usuario">
    </div>
    <div class="login-field">
      <label>Contraseña</label>
      <input id="login-password" type="password" placeholder="••••••••">
    </div>
    <div id="login-status"></div>
    <div id="login-error"></div>
    <button id="btn-login">Entrar</button>
  </div>
</div>

<!-- ══════════════ APP PRINCIPAL ══════════════ -->
<div id="app-screen" class="hidden">
  <div id="titlebar">
    <div id="status-dot"></div>
    <span>Musicali Bar — Desktop</span>
    <div id="titlebar-right">
      <span id="logged-as"></span>
      <button id="btn-toggle-sidebar">☰</button>
      <button id="btn-logout">Salir</button>
    </div>
  </div>

  <div id="main">
    <div id="player-section">
      <video id="bg-video" muted loop playsinline></video>
      <div id="now-playing">
        <div id="song-title">Sin canción</div>
        <div id="song-artist">—</div>
      </div>
      <div id="download-status">Esperando...</div>
      <video id="video-player" style="width:100%;height:100%;display:none;background:#000" controls></video>
    </div>

    <div id="sidebar">
      <div id="config-section">
        <h3>Conexión</h3>
        <div id="api-url-display"></div>
        <button id="btn-reconnect">⟳ Reconectar</button>
        <div id="fondo-section">
        <h3>🖼 Fondo</h3>
        <input id="fondo-file" type="file" accept="video/*" hidden />
        <button id="btn-seleccionar-fondo">📁 Elegir video</button>
        <button id="btn-pantalla-completa">⛶ Pantalla completa</button>
        <div id="fondo-status"></div>
      </div>

      <div id="log-section">
        <h3>Log</h3>
        <div id="log"></div>
      </div>

      <div id="queue-section">
        <h3>Próximas</h3>
        <div id="queue-list"></div>
      </div>

      <div id="videos-count">0 videos descargados</div>
    </div>
  </div>
</div>

<script src="signalr.min.js"></script>
<script>
  // ── ESTADO ──
  let connection = null
  let _api = ''
  let _tenant = ''
  let _barToken = ''
  let currentVideoId = null
  let currentTitulo = ''
  let currentArtista = ''
  let prefetchInterval = null
  const downloadingIds = new Set()

  // ── SERVER LOCAL ──
  window.__serverTvPlay = async (filePath, titulo, artista) => {
    try {
      await fetch('/api/tv/play', {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({ filePath, titulo, artista })
      })
    } catch (e) {
      console.error('[TV Play]', e)
    }
  }

  const dot = document.getElementById('status-dot')
  const logEl = document.getElementById('log')

  // ── HELPERS ──
  function log(msg, type = 'info') {
    const time = new Date().toLocaleTimeString()
    const entry = document.createElement('div')
    entry.className = `entry ${type}`
    entry.textContent = `${time} ${msg}`
    logEl.appendChild(entry)
    logEl.scrollTop = logEl.scrollHeight
  }

  function escHtml(s) {
    const d = document.createElement('div')
    d.textContent = s
    return d.innerHTML
  }

  function showApp() {
    document.getElementById('login-screen').classList.add('hidden')
    document.getElementById('app-screen').classList.remove('hidden')
    document.getElementById('api-url-display').textContent = _api
    document.getElementById('logged-as').textContent = _api.replace('http://','').replace('https://','')
  }

  function showLogin() {
    document.getElementById('app-screen').classList.add('hidden')
    document.getElementById('login-screen').classList.remove('hidden')
  }

  // ── LOGIN ──
  async function doLogin() {
    const api      = document.getElementById('login-api').value.trim()
    const username = document.getElementById('login-username').value.trim()
    const password = document.getElementById('login-password').value

    const errEl    = document.getElementById('login-error')
    const statusEl = document.getElementById('login-status')
    const btn      = document.getElementById('btn-login')

    errEl.textContent = ''
    if (!api || !username || !password) {
      errEl.textContent = 'Completa todos los campos'
      return
    }

    btn.disabled = true
    statusEl.textContent = 'Iniciando sesión...'

    try {
      // 1) Login admin → obtenemos adminToken + tenantId del response
      const loginRes = await fetch('/api/auth/login', {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({ apiUrl: api, username, password })
      })
      if (!loginRes.ok) {
        const err = await loginRes.json().catch(() => ({}))
        throw new Error(err.error || `Error ${loginRes.status}`)
      }
      const loginResult = await loginRes.json()
      // loginResult = { token, role, userId, tenantId }
      const adminToken      = loginResult.token
      const confirmedTenant = loginResult.tenantId

      statusEl.textContent = 'Generando token de bar...'

      // 2) Generar bar token
      const barRes = await fetch('/api/auth/bar-token', {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({ apiUrl: api, tenantId: confirmedTenant, adminToken })
      })
      if (!barRes.ok) {
        const err = await barRes.json().catch(() => ({}))
        throw new Error(err.error || `Error ${barRes.status}`)
      }
      const barResult = await barRes.json()
      // barResult = { token }
      const barToken = barResult.token

      // 3) Guardar sesión
      localStorage.setItem('bar-api',      api)
      localStorage.setItem('bar-tenant',   confirmedTenant)
      localStorage.setItem('bar-token',    barToken)
      localStorage.setItem('bar-username', username)

      _api      = api
      _tenant   = confirmedTenant
      _barToken = barToken

      statusEl.textContent = ''
      showApp()
      await connectSignalR()
      await updateVideoCount()

    } catch (e) {
      errEl.textContent = e.message || (typeof e === 'object' ? JSON.stringify(e) : String(e))
      statusEl.textContent = ''
    } finally {
      btn.disabled = false
    }
  }

  document.getElementById('btn-login').addEventListener('click', doLogin)

  // Enter en cualquier campo del login
  ;['login-api','login-username','login-password'].forEach(id => {
    document.getElementById(id).addEventListener('keydown', e => { if (e.key === 'Enter') doLogin() })
  })

  // ── LOGOUT ──
  document.getElementById('btn-logout').addEventListener('click', async () => {
    if (connection) await connection.stop()
    if (prefetchInterval) clearInterval(prefetchInterval)
    localStorage.removeItem('bar-api')
    localStorage.removeItem('bar-tenant')
    localStorage.removeItem('bar-token')
    localStorage.removeItem('bar-username')
    _api = ''; _tenant = ''; _barToken = ''
    showLogin()
    log('Sesión cerrada', 'warn')
  })

  // ── SIGNALR ──
  async function connectSignalR() {
    if (connection) { try { await connection.stop() } catch {} }
    if (prefetchInterval) { clearInterval(prefetchInterval); prefetchInterval = null }

    dot.className = 'connecting'
    log('Conectando a SignalR...', 'warn')

    connection = new signalR.HubConnectionBuilder()
      .withUrl(`${_api}/hubs/bar`, { accessTokenFactory: () => _barToken })
      .withAutomaticReconnect()
      .build()

        connection.on('FondoActivo', (data) => {
      const bg = document.getElementById('bg-video')
      const player = document.getElementById('video-player')
      if (data.activo) {
        bg.classList.add('activo')
        bg.play().catch(e => log("Error play fondo: " + e.message, "error"))
        player.style.opacity = '0'
        log('Fondo activado', 'success')
      } else {
        bg.classList.remove('activo')
        bg.pause()
        player.style.opacity = '1'
        log('Fondo desactivado', 'warn')
      }
    })
    connection.on('CancionActual', handleCancionActual)
    connection.onreconnecting(() => {
      dot.className = 'connecting'
      log('Reconectando...', 'warn')
      if (prefetchInterval) clearInterval(prefetchInterval)
    })
    connection.onreconnected(() => {
      dot.className = 'connected'
      log('Reconectado', 'success')
      actualizarCola()
      prefetchInterval = setInterval(() => { prefetchNext(3); actualizarCola() }, 30000)
    })
    connection.onclose(() => {
      dot.className = 'error'
      log('Desconectado', 'error')
      if (prefetchInterval) clearInterval(prefetchInterval)
    })

    const connTimeout = setTimeout(() => {
      connection.stop()
      dot.className = 'error'
      log('Timeout: el backend no respondió', 'error')
    }, 10000)

    try {
      await connection.start()
      clearTimeout(connTimeout)
      dot.className = 'connected'
      log('Conectado al backend', 'success')
      actualizarCola()
      prefetchInterval = setInterval(() => { prefetchNext(3); actualizarCola() }, 30000)
    } catch (e) {
      clearTimeout(connTimeout)
      dot.className = 'error'
      log(`Error: ${e?.message || 'desconocido'}`, 'error')
    }
  }

  document.getElementById('btn-reconnect').addEventListener('click', connectSignalR)

  // ── VIDEOS ──
  async function updateVideoCount() {
    const res = await fetch('/api/videos')
    if (!res.ok) return
    const videos = await res.json()
    document.getElementById('videos-count').textContent = `${videos.length} videos descargados`
  }

  async function actualizarCola() {
    if (!_api || !_tenant || !_barToken) return
    try {
      const res = await fetch(`${_api}/api/PlayQueue`, {
        headers: { 'Authorization': `Bearer ${_barToken}`, 'X-Tenant-Id': _tenant }
      })
      if (!res.ok) return
      const queue = await res.json()
      const waiting = queue.filter(i => i.status === 'waiting')
      const list = document.getElementById('queue-list')
      list.innerHTML = waiting.length === 0
        ? '<div style="color:#333;font-size:10px;padding:4px 0">Sin próximas</div>'
        : waiting.map((item, i) => {
            const title  = item.song?.title || 'Sin título'
            const source = item.requestId ? 'pedida' : item.isTransition ? 'transición' : 'auto'
            return `<div class="q-item"><span class="q-pos">${i+1}</span><span class="q-title">${escHtml(title)}</span><span class="q-badge">${source}</span></div>`
          }).join('')
    } catch {}
  }

  function playVideo(filePath) {
    const videoPath = filePath.replace(/\\/g, '/')
    const player = document.getElementById('video-player')
    player.style.display = 'block'
    player.src = `/videos/${encodeURIComponent(videoPath.split('/').pop() || videoPath.split('\\').pop())}`
    player.play().catch(e => log(`Error reproduciendo: ${e.message}`, 'error'))
    document.getElementById('song-title').textContent = currentTitulo
    document.getElementById('song-artist').textContent = currentArtista
    if (window.__serverTvPlay) {
      window.__serverTvPlay(videoPath, currentTitulo, currentArtista)
    }
  }

  async function siguienteCancion() {
    if (!_api || !_tenant || !_barToken) return
    log('Canción terminada, avanzando...', 'info')
    try {
      const res = await fetch(`${_api}/api/PlayQueue/next`, {
        method: 'POST',
        headers: { 'Authorization': `Bearer ${_barToken}`, 'X-Tenant-Id': _tenant }
      })
      if (!res.ok) log('No hay siguiente canción', 'warn')
    } catch(e) { log(`Error avanzando: ${e.message}`, 'error') }
  }

  async function ensureDownloaded(youtubeId, title) {
    if (downloadingIds.has(youtubeId)) {
      log(`Esperando descarga en curso: ${youtubeId}`, 'info')
      while (downloadingIds.has(youtubeId)) { await new Promise(r => setTimeout(r, 500)) }
      const checkRes = await fetch('/api/check-video', {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({ youtubeId })
      })
      if (!checkRes.ok) return null
      const checkData = await checkRes.json()
      if (checkData.path) return checkData.path
    }
    const checkRes2 = await fetch('/api/check-video', {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({ youtubeId })
    })
    if (checkRes2.ok) {
      const checkData2 = await checkRes2.json()
      if (checkData2.path) return checkData2.path
    }
    downloadingIds.add(youtubeId)
    try {
      const dlRes = await fetch('/api/download', {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({ youtubeId, title })
      })
      if (!dlRes.ok) throw new Error(`Error ${dlRes.status}`)
      const dlData = await dlRes.json()
      if (dlData.path) return dlData.path
      throw new Error(dlData.error || 'Error en descarga')
    } finally {
      downloadingIds.delete(youtubeId)
    }
  }

  async function prefetchNext(count = 3) {
    if (!_api || !_tenant || !_barToken) return
    try {
      const res = await fetch(`${_api}/api/PlayQueue`, {
        headers: { 'Authorization': `Bearer ${_barToken}`, 'X-Tenant-Id': _tenant }
      })
      if (!res.ok) return
      const queue = await res.json()
      const upcoming = queue.filter((_, i) => i > 0).slice(0, count)
      if (upcoming.length === 0) return
      log(`Precargando ${upcoming.length} videos...`, 'info')
      for (const item of upcoming) {
        const ytId = item.song?.youtubeId || item.youtubeId
        if (!ytId || downloadingIds.has(ytId)) continue
        const cachedRes = await fetch('/api/check-video', {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({ youtubeId: ytId })
        })
        if (cachedRes.ok) {
          const cachedData = await cachedRes.json()
          if (cachedData.path) continue
        }
        const title = item.song?.title || item.titulo || ytId
        downloadingIds.add(ytId)
        fetch('/api/download', {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({ youtubeId: ytId, title })
        })
          .then(() => { downloadingIds.delete(ytId); log(`Precargado: ${title}`, 'success'); updateVideoCount() })
          .catch(() => downloadingIds.delete(ytId))
      }
    } catch(e) { log(`Error precargando: ${e.message}`, 'error') }
  }

  async function handleCancionActual(data) {
    currentVideoId = data.youtubeId
    currentTitulo  = data.titulo  || ''
    currentArtista = data.fuente  || ''
    document.getElementById('titlebar').className = 'source-' + (data.fuente || 'queue')
    log(`► ${data.titulo} [${data.fuente || '?'}]`, 'success')
    document.getElementById('song-title').textContent  = data.titulo || 'Sin título'
    document.getElementById('song-artist').textContent = data.fuente || '—'
    const statusEl = document.getElementById('download-status')
    if (!data.youtubeId) { statusEl.className = 'error'; statusEl.textContent = 'Sin YouTube ID'; return }
    statusEl.className = 'downloading'; statusEl.textContent = '⬇ Verificando...'
    try {
      const filePath = await ensureDownloaded(data.youtubeId, data.titulo)
      if (data.youtubeId !== currentVideoId) { log(`Ignorando descarga obsoleta: ${data.youtubeId}`, 'warn'); return }
      playVideo(filePath)
      actualizarCola(); await updateVideoCount()
      statusEl.className = 'ready'; statusEl.textContent = '✓ Reproduciendo'

      // ── PREFETCH: siguiente en cola + próximos ──
      if (data.nextYoutubeId) {
        log(`Precargando siguiente: ${data.nextTitulo || data.nextYoutubeId}`, 'info')
        ensureDownloaded(data.nextYoutubeId, data.nextTitulo)
          .then(path => log(`✓ Siguiente precargado: ${data.nextTitulo}`, 'success'))
          .catch(err => log(`✗ Error precargando: ${err.error || err.message || err}`, 'error'))
      }
      prefetchNext(3)
    } catch(err) {
      statusEl.className = 'error'; statusEl.textContent = '✗ Error'
      log(`Error: ${err.error || err.message || err}`, 'error')
    }
  }

  // ── SIDEBAR TOGGLE ──
  document.getElementById('btn-seleccionar-fondo').addEventListener('click', () => {
    document.getElementById('fondo-file').click()
  })

  document.getElementById('fondo-file').addEventListener('change', (e) => {
    const file = e.target.files?.[0]
    if (!file) return
    const url = URL.createObjectURL(file)
    const bg = document.getElementById('bg-video')
    bg.src = url
    bg.classList.add('activo')
    bg.play().catch(e => log("Error play fondo: " + e.message, "error"))
    document.getElementById('fondo-status').textContent = `✓ ${file.name}`
    log(`Fondo cargado: ${file.name}`, 'success')
  })

  document.getElementById('btn-pantalla-completa').addEventListener('click', () => {
    const main = document.getElementById('main')
    if (!document.fullscreenElement) {
      document.documentElement.requestFullscreen().catch(() => {})
      document.getElementById('sidebar').style.display = 'none'
      main.style.gridTemplateColumns = '1fr'
    } else {
      document.exitFullscreen().catch(() => {})
      document.getElementById('sidebar').style.display = ''
      main.style.gridTemplateColumns = ''
    }
  })
  document.addEventListener('fullscreenchange', () => {
    if (!document.fullscreenElement) {
      document.getElementById('sidebar').style.display = ''
      document.getElementById('main').style.gridTemplateColumns = ''
    }
  })

  // ── FONDO ──

      document.documentElement.requestFullscreen().catch(() => {})
    } else {
      document.exitFullscreen().catch(() => {})
    }
  })

  // ── FONDO ──

    log('Fondo cargado: ' + file.name, 'success')
  })

    if (!document.fullscreenElement) {

      main.style.gridTemplateColumns = '1fr'
    } else {
      document.exitFullscreen().catch(() => {})
      document.getElementById('sidebar').style.display = ''
      main.style.gridTemplateColumns = ''
    }
  })
  document.addEventListener('fullscreenchange', () => {
    if (!document.fullscreenElement) {
      document.getElementById('sidebar').style.display = ''
      document.getElementById('main').style.gridTemplateColumns = ''
    }
  })

  // ── SIDEBAR TOGGLE ──
  let sidebarVisible = true
  document.getElementById('btn-toggle-sidebar').addEventListener('click', () => {
    const sidebar = document.getElementById('sidebar')
    const main = document.getElementById('main')
    sidebarVisible = !sidebarVisible
    document.getElementById("btn-toggle-sidebar").textContent = sidebarVisible ? "☰" : "☷"
    if (sidebarVisible) {
      sidebar.style.display = ''
      main.style.gridTemplateColumns = ''
    } else {
      sidebar.style.display = 'none'
      main.style.gridTemplateColumns = '1fr'
    }
  })

  // ── INIT ──
  window.addEventListener('DOMContentLoaded', async () => {
    document.getElementById('video-player').addEventListener('ended', siguienteCancion)

    // Prellenar API URL guardada
    const savedApi = localStorage.getItem('bar-api')
    if (savedApi) document.getElementById('login-api').value = savedApi

    // Si ya hay sesión guardada, ir directo a la app
    const savedTenant    = localStorage.getItem('bar-tenant')
    const savedBarToken  = localStorage.getItem('bar-token')
    if (savedApi && savedTenant && savedBarToken) {
      _api      = savedApi
      _tenant   = savedTenant
      _barToken = savedBarToken
      showApp()
      await connectSignalR()
      await updateVideoCount()
    }

    log('App iniciada', 'info')
  })
